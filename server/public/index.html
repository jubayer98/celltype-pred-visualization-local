<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Viewer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }
    #imageSetInput {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #555;
      background-color: #222;
      color: #e0e0e0;
    }
    button {
      padding: 8px 16px;
      border-radius: 4px;
      border: none;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    #image-container {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    .thumbnail {
      width: 100%;
      height: auto;
      border-radius: 4px;
      border: 1px solid #444;
      cursor: pointer;
      transition: transform 0.2s ease-in-out;
    }
    .thumbnail:hover {
      transform: scale(1.05);
    }
    /* The Modal (background) */
    .modal {
      display: none; /* Hidden by default */
      position: fixed; /* Stay in place */
      z-index: 1; /* Sit on top */
      padding-top: 100px; /* Location of the box */
      left: 0;
      top: 0;
      width: 100%; /* Full width */
      height: 100%; /* Full height */
      overflow: auto; /* Enable scroll if needed */
      background-color: rgba(0,0,0,0.9); /* Black w/ opacity */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Modal Content (image) */
    .modal-content {
      margin: auto;
      display: block;
      max-width: 80%;
      max-height: 80vh;
    }
    /* The Close Button */
    .close {
      position: absolute;
      top: 15px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
    }
    .close:hover,
    .close:focus {
      color: #bbb;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Image Viewer</h1>
  <div class="controls">
    <input type="text" id="imageSetInput" placeholder="e.g., 1-17">
    <button onclick="fetchImages()">Fetch Images</button>
  </div>

  <div id="image-container"></div>

  <!-- The Modal -->
  <div id="myModal" class="modal" style="display:none">
    <span class="close">&times;</span>
    <img class="modal-content" id="img01">
  </div>

  <script>
    const modal = document.getElementById("myModal");
    const modalImg = document.getElementById("img01");
    const span = document.getElementsByClassName("close")[0];

    // When the user clicks on <span> (x), close the modal
    span.onclick = function() {
      modal.style.display = "none";
    }
    // When the user clicks anywhere outside of the modal content, close it
    window.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = "none";
      }
    }

    async function fetchImages() {
      const imageSet = document.getElementById('imageSetInput').value;
      const imageContainer = document.getElementById('image-container');
      imageContainer.innerHTML = ''; // Clear previous images

      if (!imageSet) {
        alert('Please enter an image set.');
        return;
      }

      try {
        const response = await fetch(`/api/images/${imageSet}`);
        if (!response.ok) {
          throw new Error('Image set not found.');
        }
        const imageUrls = await response.json();

        if (imageUrls.length === 0) {
          imageContainer.innerHTML = '<p>No images found in this set.</p>';
          return;
        }

        imageUrls.forEach(url => {
          const img = document.createElement('img');
          img.className = 'thumbnail';
          img.src = url;
          imageContainer.appendChild(img);

          img.onclick = function(){
            modal.style.display = "flex";
            modalImg.src = this.src;
          }
        });
      } catch (error) {
        console.error('Error fetching images:', error);
        imageContainer.innerHTML = `<p>${error.message}</p>`;
      }
    }
  </script>

</body>
</html>
